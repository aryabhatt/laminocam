# git-cliff configuration: https://git-cliff.org/docs/configuration
# Commits in this repository are free-form (not Conventional Commits),
# so they are grouped by leading keyword.

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
topo_order = false
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^(Add|add|Support|support|Implement|implement)", group = "Added" },
  { message = "^(Fix|fix|Correct|correct)", group = "Fixed" },
  { message = "^(Remove|remove|Delete|delete)", group = "Removed" },
  { message = "^(Doc|doc|README|readme)", group = "Documentation" },
  { message = "^(Test|test)", group = "Tests" },
  { message = ".*", group = "Changed" },
]
